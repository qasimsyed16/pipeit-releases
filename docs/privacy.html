<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - PipeIt</title>
    <link rel="icon" type="image/svg+xml" href="assets/pipeit-logo.svg">
    <link rel="apple-touch-icon" href="assets/pipeit-logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header" style="margin-bottom: 2rem; margin-top: 1rem;">
            <a href="index.html">
                <img src="assets/pipeit-logo.svg" alt="PipeIt Logo" class="logo" style="width: 70px; margin-bottom: 1rem;">
            </a>
            <h1 style="font-size: 2rem;">Privacy Policy</h1>
            <nav class="links" style="margin-top: 1rem;">
                <a href="index.html">← Back to Home</a>
            </nav>
        </header>

        <main id="policy-content">
            <p>Loading privacy policy...</p>
        </main>
    </div>

    <script>
        function parseMarkdown(md) {
            let html = md;
            
            // Headings
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // Bold
            html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
            
            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2">$1</a>');
            
            // Bullet lists
            html = html.replace(/^[\*-] (.*$)/gim, '<ul><li>$1</li></ul>');
            // Merge adjacent ul tags
            html = html.replace(/<\/ul>\n<ul>/gim, '\n');
            
            // Paragraphs (anything not enclosed in a block level tag)
            html = html.split('\n\n').map(p => {
                let trimmed = p.trim();
                if (trimmed.startsWith('<h') || trimmed.startsWith('<ul')) {
                    return trimmed;
                }
                if (trimmed) {
                    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
                }
                return '';
            }).join('\n');
            
            return html;
        }

        fetch('content/privacy-policy.md')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch');
                return response.text();
            })
            .then(text => {
                document.getElementById('policy-content').innerHTML = parseMarkdown(text);
            })
            .catch(error => {
                console.error('Error loading policy:', error);
                document.getElementById('policy-content').innerHTML = '<p>Error loading privacy policy. Please try again later or check the repository directly.</p>';
            });
    </script>
</body>
</html>
